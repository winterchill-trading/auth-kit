name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libargon2-dev provides the reference Argon2 implementation the hash
      # sub-library binds (found through pkg-config).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libargon2-dev pkg-config
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          pins: |
            service-kit https://github.com/winterchill-trading/service-kit.git
      - run: opam exec -- dune build
      - run: opam exec -- dune build @examples/all
      - run: opam exec -- dune exec ./examples/quick_start.exe
      - run: opam exec -- dune test
      - run: opam install -y odoc
      - name: Build API docs (odoc warnings fail the step)
        run: |
          set -o pipefail
          opam exec -- dune build @doc --display short 2>&1 | tee doc.log
          if grep -q "Warning" doc.log; then exit 1; fi
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
